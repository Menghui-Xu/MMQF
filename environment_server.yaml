name: AGDA

channels:
  - pytorch
  - nvidia
  - defaults
  # Do not append duplicate/legacy channels from the server's .condarc.
  - nodefaults

dependencies:
  # Core runtime. PyTorch 2.4 keeps compatibility with the project's saved
  # tensors and uses the CUDA 12.4 runtime supported by the server driver.
  - python=3.8.20
  - pip=24.2
  - pytorch=2.4.0
  - pytorch-cuda=12.4
  # PyTorch's libtorch_cpu.so is incompatible with newer MKL releases and
  # otherwise fails at import time with an undefined iJIT_NotifyEvent symbol.
  - mkl=2023.1.0
  - intel-openmp=2023.0.0

  # Keep pip last. Binary Python wheels avoid the Python 3.8 RDKit/
  # Matplotlib/Pillow/Zlib conflicts caused by mixing Conda channels.
  # Do not add pip CUDA, cuDNN, Triton, torch-scatter or torch-sparse.
  - pip:
      - numpy==1.24.4
      - pandas==2.0.3
      - scipy==1.10.1
      - scikit-learn==1.3.2
      - networkx==3.0
      - tqdm==4.67.1
      - matplotlib==3.7.5
      - seaborn==0.13.2
      - rdkit==2024.3.5
      - torch-geometric==2.5.3
      - transformers==4.35.2
      - func-timeout==4.3.5
